<!doctype html>
<html lang="es">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="NOVERGY — Energía Renoverde, Colombia."
  >

  <meta
    name="theme-color"
    content="#0a2418"
  >

  <title>
    NOVERGY | Energía Renoverde, Colombia
  </title>


  <!-- ICONOS / FAVICON NOVERGY -->

  <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="favicon-32x32.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="apple-touch-icon.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="android-chrome-192x192.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="android-chrome-512x512.png"
  >


  <!-- ESTILOS -->

  <link
    rel="stylesheet"
    href="styles.css"
  >

</head>


<body>


  <main
    class="hero"
    aria-label="NOVERGY"
  >


    <div class="overlay"></div>


    <section class="hero-content">


      <img
        class="logo"
        src="logo-novergy.png"
        alt="NOVERGY"
      >


      <p class="descriptor">

        Energía Renoverde, Colombia.

      </p>


      <a
        class="contact"
        href="mailto:InfoNovergy@gmail.com"
        aria-label="Contactar a NOVERGY por correo electrónico"
      >

        Contact: InfoNovergy@gmail.com

      </a>


    </section>


    <footer class="footer">

      ©
      <span id="year">
        2026
      </span>

      NOVERGY S.A.S.

    </footer>


  </main>


  <script>

    document.getElementById("year").textContent =
      new Date().getFullYear();

  </script>


</body>

</html>
